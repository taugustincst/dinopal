plugins {
    id 'com.android.application'
}

// The Google Play edition of Dino Pal: free to install, with the whole game
// inside it. A single full-screen WebView plays the game from the app's own
// assets: WebViewAssetLoader serves assets/www over a synthetic https origin
// (appassets.androidplatform.net), so localStorage keeps the pet's progress
// between launches like it would on a secure site. The app asks for no
// permission at all: the game is fully offline and makes no network requests.
//
// The same shape as Pocket Decks' Play edition, minus billing: Dino Pal has
// nothing to sell. tools/check-apk.cjs checks every APK built here.

// Release signing: the upload key from android/keystore.properties when it
// exists (never committed; the Release workflow writes it from the repo's
// ANDROID_UPLOAD_* secrets), the debug key otherwise. Play only takes a
// bundle signed with the listing's upload key.
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

// Every Play upload needs a higher versionCode than any earlier one. The
// release workflow derives it from the version (1.0.0 -> 10000).
def relVersionCode = (project.hasProperty('versionCode') ? project.property('versionCode') : '10000').toString().toInteger()
def relVersionName = (project.hasProperty('versionName') ? project.property('versionName') : '1.0.0').toString()

// The game is a single self-contained page at examples/virtual-pet/index.html.
// It is copied into the app's assets as assets/www/index.html at build time,
// so the app can never drift from the game's source and no second copy is
// checked in.
def webRoot = rootProject.file('../examples/virtual-pet')
def genAssetsDir = new File(buildDir, 'generated/webAssets')
tasks.register('syncWebAssets', Copy) {
    from(webRoot) {
        include 'index.html'
    }
    into(new File(genAssetsDir, 'www'))
}

android {
    // The package name is the app's identity on Google Play: the listing is
    // created under it, and Play never lets it change.
    namespace 'com.augustinnovations.dinopal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.augustinnovations.dinopal'
        minSdk 24
        targetSdk 36
        versionCode relVersionCode
        versionName relVersionName
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Nothing worth shrinking, and shrinking is one more way for a
            // class the manifest names to go missing from the dex.
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += genAssetsDir
        }
    }
}

tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // WindowCompat and WindowInsetsControllerCompat: full screen on every
    // Android the app supports (the platform's own controller is API 30+).
    implementation 'androidx.core:core:1.16.0'
    // The BOM pins the kotlin-stdlib versions the AndroidX libraries pull in
    // to one version, or the build can fail on duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
